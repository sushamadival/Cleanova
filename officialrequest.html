<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleanova - Official Request</title>
    <style>
        /* --- Layout Styles --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                              url('https://images.unsplash.com/photo-1523292562811-8fa7962a78c8?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Z292ZXJubWVudHxlbnwwfHwwfHx8MA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Cleanova Admin Top Header --- */
        .top-header {
            background-color: #ffffff;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            background-color: #1a5276;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #1a5276;
        }

        .brand-name span {
            color: #2c3e50;
            font-weight: 400;
            margin-left: 5px;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #1a5276;
            overflow-x: hidden;
            transition: 0.4s;
            padding-top: 60px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .sidebar-title {
            color: white;
            font-size: 22px;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            font-size: 16px;
            color: #d1d9e0;
            display: block;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.1);
            color: white;
            padding-left: 35px;
        }

        .closebtn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }

        .openbtn {
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: none;
            color: #1a5276;
            margin-right: 20px;
            font-weight: bold;
        }

        /* --- Form Container Adjustment --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px 20px; /* Space for top-header */
        }

        .form-container {
            width: 420px;
            padding: 25px;
            background: rgba(238, 234, 234, 0.97);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* --- Rest of your Original CSS (Unchanged) --- */
        .header { text-align: center; margin-bottom: 25px; }
        .gov-logo { max-width: 80px; height: auto; margin-bottom: 10px; }
        h2 { color: #2c3e50; font-size: 1.3rem; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #444; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-done { background-color: #1a5276; color: white; padding: 14px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: bold; margin-top: 10px; }
        .btn-done:hover { background-color: #154360; }
    </style>
</head>
<body>

<header class="top-header">
    <button class="openbtn" onclick="openNav()">☰</button>
    <div class="brand-container">
        <div class="brand-logo">🛡️</div>
        <div class="brand-name">Cleanova </div>
    </div>
</header>

<div id="mySidebar" class="sidebar">
    <span class="closebtn" onclick="closeNav()">&times;</span>
    <div class="sidebar-title">CLEANOVA</div>
    <a href="officialhome.html">🏠 Home</a> 
     <a href="offreported.html"> 🚩 Report</a>
      <a href="offinprogress.html"> ⏳In Progress</a>
       <a href="offsolved.html"> ✅Solved</a>
        <a href="officialachievement.html">🏆Achievements</a>
         <a href="officialFAQ.html">❓FAQ</a>
          <a href="officialrequest.html">📢 Request</a>
           <a href="officialsupport.html">🎧Support</a>
            <a href="offfine.html">💰 Fine List</a>
   
</div>

<div class="main-content">
    <div class="form-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Emblem_of_India_with_transparent_background.png" alt="Government Logo" class="gov-logo">
            <h2>Official Request Submission</h2>
        </div>

        <form id="requestForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Contact Number" required>
            </div>

            <div class="form-group">
                <label for="adminOption">Administrative Options</label>
                <select id="adminOption">
                    <option value="President">President</option>
                    <option value="Municipality">Municipality</option>
                </select>
            </div>

            <div class="form-group">
                <label for="designation">Designation/Role</label>
                <select id="designation">
                    <option value="PDO">PDO</option>
                    <option value="President">President</option>
                    <option value="Vice President">Vice President</option>
                    <option value="Member">Member</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Residential Address" required></textarea>
            </div>

            <div class="form-group">
                <label for="idNumber">ID</label>
                <input type="text" id="idNumber" placeholder="Enter your ID Number" required>
            </div>

            <div class="form-group">
                <label for="details">Request Details</label>
                <textarea id="details" placeholder="What is your request?" required></textarea>
            </div>

            <button type="button" class="btn-done" onclick="submitForm()">Done</button>
        </form>
    </div>
</div>

<script>
    function openNav() {
        document.getElementById("mySidebar").style.width = "260px";
    }

    function closeNav() {
        document.getElementById("mySidebar").style.width = "0";
    }

    function submitForm() {
        const form = document.getElementById('requestForm');
        if (form.checkValidity()) {
            alert("Your request has been successfully submitted.");
            form.reset();
        } else {
            alert("Please complete all fields before submitting.");
        }
    }
</script>

</body>
</html>
