<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information & Instructions - Waste Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Background setup */
        .bg-blur-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://www.shutterstock.com/image-photo/blur-waste-plastic-bottles-other-260nw-1447171526.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            z-index: -1;
            transform: scale(1.1);
        }

        .main-wrapper {
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: 0.2s;
            border-bottom: 1px solid #f3f4f6;
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
            color: #10b981;
        }

        .sidebar a:hover {
            background: #f1f5f9;
            color: #10b981;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        /* Typography */
        .page-title {
            text-align: center;
            color: white;
            font-size: 3rem;
            font-weight: 800;
            margin: 40px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Content Boxes */
        .info-box {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }

        .section-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .green-theme { background: #059669; }
        .amber-theme { background: #d97706; }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            padding: 25px;
            gap: 15px;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.95rem;
            color: #1f2937;
            padding: 8px;
            border-bottom: 1px solid #f3f4f6;
        }

        @media (max-width: 640px) {
            .grid-container { grid-template-columns: 1fr; }
            .page-title { font-size: 2rem; }
        }
        .fab{
  position:fixed;
  right:18px;
  bottom:22px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#00d09c,#00a3ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:9999;
}

.fab-menu{
  position:fixed;
  right:24px;
  bottom:90px;
  display:none;
  flex-direction:column;
  gap:14px;
  z-index:9999;
}

.fab-menu a{
  width:48px;
  height:48px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00d09c;
  font-size:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.25);
  text-decoration:none;
}
    </style>
</head>
<body>

    <div class="bg-blur-overlay"></div>
    
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <a href="citizenhome.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="citizenreported.html"><i class="fa-solid fa-users"></i> Reported Cases</a>
        <a href="citizensolved.html"><i class="fa-solid fa-check"></i> Solved Cases</a>
        <a href="citizeninprogress.html"><i class="fa-solid fa-spinner"></i> In Progress</a>
        <a href="citizenreport.html"><i class="fa-solid fa-file-lines"></i> Report</a>
        <a href="citizenachievements.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
        <a href="citizeninfo.html"><i class="fa-solid fa-chalkboard-user"></i> Instructions</a>
        <a href="allprivacy.html"><i class="fa-solid fa-user-shield"></i> Privacy</a>
        <a href="citizenabout.html"><i class="fa-solid fa-address-card"></i> About Us</a>
        <a href="citizenfines.html"><i class="fa-solid fa-money-bill-1"></i> Your Fine</a>
        <a href="citizendiscount.html"><i class="fa-solid fa-gift"></i> Discount</a>
        <a href="citizenFAQ1.html"><i class="fa-solid fa-circle-question"></i> FAQ</a>
    </nav>

    <div class="main-wrapper">
        <header class="navbar">
            <div class="nav-left">
                <button class="icon-btn" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
            </div>
            <div class="header-center">Cleanova</div>
            <div class="nav-right">
                <div class="cursor-pointer text-gray-700"><i data-lucide="user-circle"></i></div>
            </div>
        </header>

        <main class="content">
            <h1 class="page-title">Information & Instructions</h1>

            <section class="info-box">
                <div class="section-header green-theme">
                    <i data-lucide="info"></i>
                    <h2>Waste Management Information</h2>
                </div>
                <div id="info-grid" class="grid-container"></div>
            </section>

            <section class="info-box mt-10">
                <div class="section-header amber-theme">
                    <i data-lucide="alert-circle"></i>
                    <h2>Instructions for Citizens</h2>
                </div>
                <div id="instr-grid" class="grid-container"></div>
            </section>
        </main>
    </div>
     <div class="fab" onclick="toggleFabMenu(event)">
  <i class="fa-solid fa-ellipsis-vertical"></i>
</div>
<div class="fab-menu" id="fabMenu">
  <a href="tel:9876543210"><i class="fa-solid fa-phone"></i></a>
  <a href="sms:9876543210"><i class="fa-solid fa-message"></i></a>
</div>

    <script>
          function toggleFabMenu(event) {
  event.stopPropagation();
  const fab = document.getElementById("fabMenu");
  fab.style.display = (fab.style.display === "flex") ? "none" : "flex";
}
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const infoList = [
                "Wet waste is collected separately in green bins.",
                "It is put into specialized compost pits or bins.",
                "Microorganisms naturally decompose the organic waste.",
                "After a few weeks, it transforms into organic manure.",
                "Manure is used to enrich soil in public gardens.",
                "Dry waste is sorted at recovery facilities.",
                "Plastic waste is shredded for road construction.",
                "Paper waste is sent for recycling into pulp.",
                "Metal scraps are melted for industrial reuse.",
                "E-waste is processed to recover precious minerals.",
                "Non-recyclable waste is used for waste-to-energy plants.",
                "Regular collection helps prevent street littering.",
                "Waste segregation reduces landfill pressure.",
                "Hazardous waste is neutralized before disposal.",
                "Biogas can be generated from kitchen waste.",
                "Community composting reduces transportation costs.",
                "Systematic removal prevents drainage clogging.",
                "Public bins are emptied on a 24-hour cycle.",
                "Sanitation workers are provided with safety gear.",
                "Monitoring is done via GPS-enabled vehicles."
            ];

            const instrList = [
                "Do not mix food waste with plastic or metal.",
                "Dispose of batteries and chemicals separately.",
                "Medical waste must be handed over in marked bags.",
                "Do not store waste for long periods to avoid odor.",
                "Wash plastic containers before putting them in dry waste.",
                "Do not burn waste in open spaces or backyards.",
                "Keep sharp objects like glass wrapped in paper.",
                "Sanitary waste should be wrapped in newspapers.",
                "Use compostable bags for wet waste collection.",
                "Report overflowing public bins via the mobile app.",
                "Do not throw waste into drains or water bodies.",
                "Ensure pets do not scatter waste piles.",
                "Keep household bins covered at all times.",
                "Avoid using single-use plastics entirely.",
                "Coordinate with your local collector's timing.",
                "Large garden waste requires special pickup requests.",
                "Construction debris should not be mixed with household waste.",
                "Educate children on the importance of segregation.",
                "Avoid liquid waste in the common dry bin.",
                "Always follow the color-coding (Green/Blue/Red)."
            ];

            const infoGrid = document.getElementById('info-grid');
            const instrGrid = document.getElementById('instr-grid');

            infoList.forEach(text => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-500 w-5 h-5 flex-shrink-0"></i> <span>${text}</span>`;
                infoGrid.appendChild(item);
            });

            instrList.forEach(text => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `<i data-lucide="help-circle" class="text-amber-500 w-5 h-5 flex-shrink-0"></i> <span>${text}</span>`;
                instrGrid.appendChild(item);
            });

            lucide.createIcons(); 
          
        });
    </script>
</body>
</html>
