<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen FAQ | Cleanova</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --secondary: #1e293b;
            --bg-light: #f8fafc;
            --text-main: #334155;
            --glass-white: rgba(255, 255, 255, 0.9);
            --green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.8)), 
                        url('https://images.unsplash.com/photo-1451187530220-4e2b130a7476?q=80&w=2072&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar.open { left: 0; }

        .sidebar a {
            padding: 14px 24px;
            text-decoration: none;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
            color: var(--primary);
        }

        .sidebar a:hover {
            background: #f1f5f9;
            color: var(--primary);
            padding-left: 30px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1500;
            backdrop-filter: blur(4px);
        }

        .overlay.active { display: block; }

        /* HEADER CENTERED LOGO LOGIC */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* 3 Columns: Left, Center, Right */
            align-items: center;
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-left { display: flex; align-items: center; justify-content: flex-start; }
        .nav-right { display: flex; align-items: center; justify-content: flex-end; }

        .hamburger { 
            font-size: 24px; 
            cursor: pointer; 
            padding: 5px;
            transition: 0.3s;
        }
        .hamburger:hover { color: var(--green); }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .login-btn {
            background: var(--green);
            color: white;
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .login-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
        }

        /* FAQ Container */
        .faq-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 40px;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .faq-item {
            background: white;
            border-radius: 15px;
            margin-bottom: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }

        .faq-item:hover { border-color: var(--green); }

        .faq-question {
            padding: 22px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .faq-answer {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0, 1, 0, 1);
            background: #fafafa;
            border-radius: 0 0 15px 15px;
        }

        .faq-item.active .faq-answer {
            padding: 25px;
            max-height: 500px;
            border-top: 1px solid #f1f5f9;
            transition: all 0.4s cubic-bezier(1, 0, 1, 0);
        }

        .status-badge {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: inline-block;
        }

        .toggle-icon { transition: 0.3s; color: var(--primary); font-size: 1.2rem; }
        .faq-item.active .toggle-icon { transform: rotate(180deg); }

        .fab {
            position: fixed; right: 25px; bottom: 25px; width: 60px; height: 60px; border-radius: 50%; 
            background: linear-gradient(135deg,#10b981,#3b82f6); color: white; display: flex; align-items: center; 
            justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 9999;
        }

        .fab-menu {
            position: fixed; right: 31px; bottom: 100px; display: none; flex-direction: column; gap: 15px; z-index: 9999;
        }

        .fab-menu a {
            width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: var(--green); font-size: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); text-decoration: none;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <a href="mainall.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="mainall.html"><i class="fa-solid fa-list-ul"></i> All</a>
        <a href="mainachievement.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
        <a href="citizenfaq.html"><i class="fa-solid fa-circle-question"></i> FAQ</a>
        <a href="mainsupport.html"><i class="fa-solid fa-headset"></i> Support</a>
        <a href="maininstruction.html"><i class="fa-solid fa-chalkboard-user"></i> Instructions & Info</a>
        <a href="mainreport.html#"><i class="fa-solid fa-thumbtack"></i> Report</a>
        <a href="mainprivacy.html"><i class="fa-solid fa-user-shield"></i> Privacy Policy</a>
        <a href="mainabout.html"><i class="fa-solid fa-address-card"></i> About Us</a>
    </nav>

    <header>
        <div class="nav-left">
            <div class="hamburger" onclick="toggleSidebar()">☰</div>
        </div>
        
        <h1>Cleanova</h1>
        
        <div class="nav-right">
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </header>

    <main class="faq-container">
        <div class="page-header">
            <h1>Frequently Asked Questions</h1>
            <p>Answers to your most frequently asked questions about a cleaner city.</p>
        </div>

        <div id="faq-list"></div>
    </main>

    <div class="fab" onclick="toggleFabMenu(event)">
        <i class="fa-solid fa-plus"></i>
    </div>
    <div class="fab-menu" id="fabMenu">
        <a href="tel:9876543210" title="Call Us"><i class="fa-solid fa-phone"></i></a>
        <a href="sms:9876543210" title="Message Us"><i class="fa-solid fa-message"></i></a>
    </div>

    <script>
        const faqData = [
            { q: "How do I report a missed garbage collection?", a: "You can report it via the 'Report' section in the sidebar. Once logged in, you can tag the specific location and upload a photo for faster verification." },
            { q: "What counts as e-waste?", a: "Items like batteries, old phones, laptops, and chargers. These contain hazardous materials and should be dropped off at designated 'Green Points' found on our map." },
            { q: "Is composting mandatory for households?", a: "It is currently encouraged. Households that participate in our community composting program receive a 5% discount on their annual utility bills." },
            { q: "Where can I drop off old paint cans?", a: "Chemical waste like paint and motor oil must be taken to the City Recycling Center. Check the 'Instructions' page for a list of accepted materials." },
            { q: "Are plastic straws recyclable?", a: "Generally, no. Most recycling machines cannot process small, thin plastics. We recommend switching to reusable alternatives to reduce waste." },
            { q: "How do I dispose of a broken refrigerator?", a: "Large appliances require a 'Bulk Item Pickup'. Log in to your dashboard to schedule a collection at your convenience." }
        ];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function toggleFabMenu(event) {
            event.stopPropagation();
            const fabMenu = document.getElementById("fabMenu");
            const isVisible = fabMenu.style.display === "flex";
            fabMenu.style.display = isVisible ? "none" : "flex";
            event.currentTarget.querySelector('i').style.transform = isVisible ? 'rotate(0deg)' : 'rotate(45deg)';
            event.currentTarget.querySelector('i').style.transition = '0.3s';
        }

        function loadFAQ() {
            const container = document.getElementById('faq-list');
            container.innerHTML = faqData.map((item) => `
                <div class="faq-item" onclick="this.classList.toggle('active')">
                    <div class="faq-question">
                        <span>${item.q}</span>
                        <i class="ph ph-caret-down toggle-icon"></i>
                    </div>
                    <div class="faq-answer">
                        <span class="status-badge">Official Response</span>
                        <p>${item.a}</p>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            loadFAQ();
            lucide.createIcons();
        };

        window.onclick = function(event) {
            const fabMenu = document.getElementById("fabMenu");
            if (fabMenu && fabMenu.style.display === "flex") {
                fabMenu.style.display = "none";
                document.querySelector('.fab i').style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body>
</html>
