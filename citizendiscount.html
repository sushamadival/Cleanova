<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Rewards | Cleanova</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --secondary: #1e293b;
            --glass-white: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f8fafc;
        }

        /* Background Image with Blur */
        .bg-blur {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.8);
            transform: scale(1.1);
            z-index: -1;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 2000;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            overflow-y: auto;
        }

        .sidebar.open { left: 0; }

        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
            color: var(--primary);
        }

        .sidebar a:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1500;
        }

        .overlay.active { display: block; }

        /* Header Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(30, 41, 59, 0.95);
            color: white;
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .menu-icon, .profile-icon {
            font-size: 1.6rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        /* Content */
        .content-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
        }

        .main-title {
            text-align: center;
            font-size: 2.8rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #e2e8f0;
            margin-bottom: 40px;
        }

        .discount-grid {
            display: grid;
            gap: 20px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--glass-white);
            padding: 22px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.95);
        }

        .discount-tag {
            background: #d1fae5;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            text-align: right;
        }
             
        .fab{
  position:fixed;
  right:18px;
  bottom:22px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#00d09c,#00a3ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:9999;
}

.fab-menu{
  position:fixed;
  right:24px;
  bottom:90px;
  display:none;
  flex-direction:column;
  gap:14px;
  z-index:9999;
}

.fab-menu a{
  width:48px;
  height:48px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00d09c;
  font-size:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.25);
  text-decoration:none;
}
    </style>
</head>
<body>
    <div class="bg-blur"></div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <a href="citizenhome.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="citizenreported.html"><i class="fa-solid fa-users"></i> Reported Cases</a>
        <a href="citizensolved.html"><i class="fa-solid fa-check"></i> Solved Cases</a>
        <a href="citizeninprogress.html"><i class="fa-solid fa-spinner"></i> In Progress</a>
        <a href="citizenreport.html"><i class="fa-solid fa-file-lines"></i> Report</a>
        <a href="citizenachievements.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
        <a href="citizeninfo.html"><i class="fa-solid fa-chalkboard-user"></i> Instructions</a>
        <a href="allprivacy.html"><i class="fa-solid fa-user-shield"></i> Privacy</a>
        <a href="citizenabout.html"><i class="fa-solid fa-address-card"></i> About Us</a>
        <a href="citizenfines.html"><i class="fa-solid fa-money-bill-1"></i> Your Fine</a>
        <a href="citizendiscount.html"><i class="fa-solid fa-gift"></i> Discount</a>
        <a href="citizenFAQ1.html"><i class="fa-solid fa-circle-question"></i> FAQ</a>
    </nav>

    <header class="navbar">
        <div class="nav-left">
            <i class="ph ph-list menu-icon" onclick="toggleSidebar()"></i>
        </div>
        <div class="header-center">Cleanova</div>
        <div class="nav-right">
            <i class="ph ph-user-circle profile-icon"></i>
        </div>
    </header>

    <main class="content-wrapper">
        <h1 class="main-title">Your Discounts</h1>
        <p class="subtitle">Eco-rewards for a cleaner community</p>
        
        <div id="discount-container" class="discount-grid"></div>
    </main>
       <div class="fab" onclick="toggleFabMenu(event)">
  <i class="fa-solid fa-ellipsis-vertical"></i>
</div>
<div class="fab-menu" id="fabMenu">
  <a href="tel:9876543210"><i class="fa-solid fa-phone"></i></a>
  <a href="sms:9876543210"><i class="fa-solid fa-message"></i></a>
</div>


    <script>
        const rewards = [
            { type: "Home Water Bill", issue: "Reported Major Pipe Leak", date: "Dec 10, 2024", time: "10:30 AM", value: "₹25.00 Credit" },
            { type: "Property Tax Rebate", issue: "Organized Cleanup", date: "Nov 28, 2024", time: "09:00 AM", value: "5% Reduction" },
            { type: "Electricity Credit", issue: "Reported Illegal Dumping", date: "Nov 15, 2024", time: "04:15 PM", value: "10% OFF" },
            { type: "Waste Fee", issue: "Recycling Certification", date: "Oct 30, 2024", time: "11:20 AM", value: "₹15.00 Off" },
            { type: "Parking Voucher", issue: "Reported Bin Overflow", date: "Oct 12, 2024", time: "02:45 PM", value: "2 Free Hours" }
        ];
         function toggleFabMenu(event) {
  event.stopPropagation();
  const fab = document.getElementById("fabMenu");
  fab.style.display = (fab.style.display === "flex") ? "none" : "flex";
}
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function loadRewards() {
            const container = document.getElementById('discount-container');
            container.innerHTML = rewards.map(item => `
                <div class="card">
                    <div class="details">
                        <span class="discount-tag">${item.type}</span>
                        <p style="margin-top: 10px; font-weight: 600; color: #1e293b;">${item.issue}</p>
                        <p style="font-size: 0.8rem; color: #64748b;">${item.date} at ${item.time}</p>
                    </div>
                    <div class="value">
                        <span class="amount">${item.value}</span>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            loadRewards();
            lucide.createIcons(); 
        };
    </script>
</body>
</html>
