<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>In Progress Issues</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --green:#00d09c;
  --blue:#00a3ff;
}

/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
              url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIEZsEmgp92R5ZRwJwLAIRh2dGbxu9Hz3Gvg&s');
  background-attachment: fixed;
  background-size: cover;
  color: #333;
  overflow-x: hidden;
}
/* ===== HEADER ===== */
header{
  display:grid;
  grid-template-columns:40px auto 1fr auto 40px;
  gap: 15px;
  align-items:center;
  padding:14px 18px;
  background:linear-gradient(90deg,var(--green),var(--blue));
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.hamburger{
  font-size:28px;
  cursor:pointer;
}

.header-vehicle {
  font-size: 24px;
  cursor: pointer;
}

header h1{
  text-align:center;
  margin:0;
  font-size:22px;
}

.login-btn {
  background: white;
  color: var(--green);
  border: none;
  padding: 6px 15px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}

/* ===== SLIDE BAR MENU ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: #fff;
  box-shadow: 5px 0 25px rgba(0,0,0,0.3);
  z-index: 2001;
  transition: 0.4s ease;
  display: flex;
  flex-direction: column;
  padding-top: 20px;
}

.sidebar.active {
  left: 0;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 16px 20px;
  text-decoration: none;
  color: #333;
  font-size: 16px;
  border-bottom: 1px solid #f0f0f0;
}

.sidebar i {
  color: var(--green);
  width: 20px;
}

.sidebar a:hover {
  background: #f9f9f9;
  color: var(--green);
}

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 2000;
}

.sidebar-overlay.active {
  display: block;
}

/* ===== GRID ===== */
.container{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* ===== ISSUE CARD ===== */
.issue-card{
  position:relative;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.issue-card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.issue-card h4{
  margin:0;
  padding:12px;
}

.issue-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:18px;
  opacity:0;
  transition:0.3s;
  cursor:pointer;
}
.issue-card:hover .issue-overlay{
  opacity:1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  padding:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

.stat i{
  font-size:26px;
  color:var(--green);
}

.stat h2{
  margin:8px 0 0;
}
.filters{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:15px;
}

.filter{
  padding:8px 16px;
  border-radius:20px;
  background:white;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-decoration: none;
  color: #333;
}

.filter.active{
  background:var(--green);
  color:white;
}

/* SEARCH */
.search{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.search input{
  width:85%;
  max-width:400px;
  padding:10px 14px;
  border-radius:12px;
  border:none;
  outline:none;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.popup-content{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:18px;
  padding:18px;
  position: relative;
}

.popup-content img{
  width:100%;
  border-radius:12px;
}

.close{
  position: absolute;
  top: 10px;
  right: 15px;
  font-size:22px;
  cursor:pointer;
}

/* ===== FLOATING MENU ===== */
.fab{
  position:fixed;
  right:18px;
  bottom:22px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#00d09c,#00a3ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:1999;
}

.fab-menu{
  position:fixed;
  right:24px;
  bottom:90px;
  display:none;
  flex-direction:column;
  gap:14px;
  z-index:1999;
}

.fab-menu a{
  width:48px;
  height:48px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00d09c;
  font-size:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.25);
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <div class="hamburger" onclick="toggleSidebar()">☰</div>
  <div class="header-vehicle" onclick="openLoginPopup(event)">
    <i class="fa-solid fa-truck-pickup"></i>
  </div>
  <h1>Cleanova</h1>
  <a href="login.html" class="login-btn">Login</a>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <a href="mainall.html"><i class="fa-solid fa-house"></i> Home</a>
  <a href="mainall.html"><i class="fa-solid fa-list-ul"></i> All</a>
  <a href="mainachievement.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
  <a href="citizenfaq.html"><i class="fa-solid fa-circle-question"></i> FAQ</a>
  <a href="mainsupport.html"><i class="fa-solid fa-headset"></i> Support</a>
  <a href="maininstruction.html"><i class="fa-solid fa-chalkboard-user"></i> Instructions & Info</a>
  <a href="#"><i class="fa-solid fa-thumbtack"></i> Report</a>
  <a href="mainprivacy.html"><i class="fa-solid fa-user-shield"></i> Privacy Policy</a>
  <a href="mainabout.html"><i class="fa-solid fa-address-card"></i> About Us</a>
</div>

<div class="popup" id="loginPopup">
  <div class="popup-content" style="text-align: center; padding: 30px;">
    <div class="close" onclick="closeLoginPopup()">✖</div>
    <i class="fa-solid fa-truck-fast" style="font-size: 50px; color: var(--green); margin-bottom: 15px;"></i>
    <h3>Vehicle Tracking</h3>
    <p>Please login to access vehicle status and location.</p>
    <a href="login.html" class="login-btn" style="display:inline-block; padding: 10px 25px; background: var(--green); color: white;">Login</a>
  </div>
</div>

<div class="stats">
  <div class="stat"><i class="fa-solid fa-check"></i><h2>128 Solved</h2></div>
  <div class="stat"><i class="fa-solid fa-spinner"></i><h2>14 In Progress</h2></div>
  <div class="stat"><i class="fa-solid fa-users"></i><h2>200 Reports</h2></div>
</div>

<div class="filters">
  <a href="mainall.html" class="filter">All</a>
  <a href="mainsolved.html" class="filter">Solved</a>
  <a class="filter active">In Progress</a>
  <a href="mainreport.html" class="filter">Reported</a>
</div>

<div class="search">
  <input type="text" placeholder="Search by area or issue...">
</div>

<div class="container" id="issues"></div>

<div class="fab" onclick="toggleFabMenu(event)">
  <i class="fa-solid fa-ellipsis-vertical"></i>
</div>

<div class="fab-menu" id="fabMenu">
  <a href="tel:9876543210" title="Call">
    <i class="fa-solid fa-phone"></i>
  </a>
  <a href="sms:9876543210" title="Message">
    <i class="fa-solid fa-message"></i>
  </a>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <div class="close" onclick="closePopup()">✖</div>
    <img id="pimg">
    <h3 id="ptitle"></h3>
    <p><b>Area:</b> <span id="ploc"></span></p>
    <p><b>Reported:</b> <span id="prep"></span></p>
    <p><b>Status:</b> In Progress</p>
  </div>
</div>

<script>
/* ===== 10 IN-PROGRESS ISSUES ===== */
const issues=[
  ["Roadside litter clean up","Puttur","30 August 2025","https://static.vecteezy.com/system/resources/previews/065/335/304/large_2x/roadside-litter-with-traffic-cone-and-workers-cleaning-up-trash-on-the-highway-shoulder-area-photo.jpeg"],
  ["Stream cleanup","Nagara","27 January 2025","https://raleighnc.gov/sites/default/files/styles/16_9_384x216/public/2019-11/stream-cleanup-volunteer.jpg?itok=yp2TYwVO"],
  ["Dump clearing","Highway","03 March 2025","https://www.mercurynews.com/wp-content/uploads/2018/04/sjm-l-litter-0422-02.jpg?w=525"],
  ["Road side dumping cleaning","Highway","22 December 2025","https://static.toiimg.com/thumb/msid-125353849,imgsize-70512,width-400,height-225,resizemode-72/sweeping-change-118-truckloads-of-waste-cleared-in-mega-clean-up-drive-in-bengaluru.jpg"],
  ["water trash clearing","MG Road","09 January 2025","https://img.freepik.com/premium-photo/men-cleaning-garbage-water_1048944-14810804.jpg"],
  ["Road side trash cleaning","Punacha","19 June 2025","https://media.gettyimages.com/id/1479372148/photo/collecting-litter-from-the-side-of-the-road.jpg?s=612x612&w=gi&k=20&c=B_DI66Vn8MHoigGW-Gsl-Mec8MRt_prEqnkcx2ICygs="],
  ["Garbage not collected","Bypass","10 October 2025","https://media.assettype.com/deccanherald%2Fimport%2Fsites%2Fdh%2Ffiles%2Farticleimages%2F2022%2F08%2F28%2Ffile7cixwh43yc9xko2el27-1140008-1661640526.jpg?w=undefined&auto=format%2Ccompress&fit=max"],
  ["Lake cleanup","Lotus Lake","19 Febraury 2025","https://images.unsplash.com/photo-1758599668949-5118d71838fd?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"],
  ["Roadside dumping","Highway","09 Febraury 2025","https://th-i.thgim.com/public/incoming/72yre2/article67822960.ece/alternates/FREE_1200/08_Someshwara%201.jpg"],
  ["Lake Area","Bolwar","11 June 2025","https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSw3npwKEYpjfQ74CKLUGf-J7mhs7Xb_XSAjw&s"]
];

/* ===== RENDER ===== */
document.getElementById("issues").innerHTML = issues.map((i,idx)=>`
<div class="issue-card">
  <img src="${i[3]}">
  <div class="issue-overlay"
   onclick="openPopup('${i[0]}','${i[1]}','${i[2]}','${i[3]}')">
   View Details
  </div>
  <h4>${i[0]}</h4>
</div>
`).join("");

/* ===== VEHICLE POPUP FUNCTIONS ===== */
function openLoginPopup(e) {
  e.stopPropagation();
  document.getElementById("loginPopup").style.display = "flex";
}
function closeLoginPopup() {
  document.getElementById("loginPopup").style.display = "none";
}

/* ===== SIDEBAR FUNCTIONS ===== */
function toggleSidebar(){
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.toggle("active");
  overlay.classList.toggle("active");
}

function toggleFabMenu(event) {
  event.stopPropagation();
  const fab = document.getElementById("fabMenu");
  fab.style.display = (fab.style.display === "flex") ? "none" : "flex";
}

function openPopup(t,l,r,img){
  document.getElementById("ptitle").innerText=t;
  document.getElementById("ploc").innerText=l;
  document.getElementById("prep").innerText=r;
  document.getElementById("pimg").src=img;
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

// Close menus when clicking outside
window.onclick = function(event) {
  if (event.target.className === 'popup') {
    closePopup();
    closeLoginPopup();
  }
}
</script>

</body>
</html>
