<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reported Issues</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --green:#00d09c;
  --blue:#00a3ff;
}

/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
              url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIEZsEmgp92R5ZRwJwLAIRh2dGbxu9Hz3Gvg&s');
  background-attachment: fixed;
  background-size: cover;
  color: #333;
  overflow-x: hidden;
}

/* ===== HEADER ===== */
header{
  display:grid;
  grid-template-columns:40px auto 1fr auto 40px;
  gap: 15px;
  align-items:center;
  padding:14px 18px;
  background:linear-gradient(90deg,var(--green),var(--blue));
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.hamburger{
  font-size:28px;
  cursor:pointer;
}

.header-vehicle {
  font-size: 24px;
  cursor: pointer;
}

header h1{
  text-align:center;
  margin:0;
  font-size:22px;
}

.login-btn {
  background: white;
  color: var(--green);
  border: none;
  padding: 6px 15px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}

/* ===== SLIDE BAR MENU ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: #fff;
  box-shadow: 5px 0 25px rgba(0,0,0,0.3);
  z-index: 2001;
  transition: 0.4s ease;
  display: flex;
  flex-direction: column;
  padding-top: 20px; /* Space since header is removed */
}

.sidebar.active {
  left: 0;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 16px 20px;
  text-decoration: none;
  color: #333;
  font-size: 16px;
  border-bottom: 1px solid #f0f0f0;
}

.sidebar a i {
  color: var(--green);
  width: 20px;
}

.sidebar a:hover {
  background: #f9f9f9;
  color: var(--green);
}

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 2000;
}

.sidebar-overlay.active {
  display: block;
}

/* ===== GRID ===== */
.container{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* ===== ISSUE CARD ===== */
.issue-card{
  position:relative;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.issue-card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.issue-card h4{
  margin:0;
  padding:12px;
}

.issue-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:18px;
  opacity:0;
  transition:0.3s;
  cursor:pointer;
}
.issue-card:hover .issue-overlay{
  opacity:1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  padding:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

.stat i{
  font-size:26px;
  color:var(--green);
}

.stat h2{
  margin:8px 0 0;
}
.filters{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:15px;
}

.filter{
  padding:8px 16px;
  border-radius:20px;
  background:white;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-decoration: none;
  color: #333;
}

.filter.active{
  background:var(--green);
  color:white;
}

/* SEARCH */
.search{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.search input{
  width:85%;
  max-width:400px;
  padding:10px 14px;
  border-radius:12px;
  border:none;
  outline:none;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.popup-content{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:18px;
  padding:18px;
  position: relative;
}

.popup-content img{
  width:100%;
  border-radius:12px;
}

.close{
  position: absolute;
  top: 10px;
  right: 15px;
  font-size:22px;
  cursor:pointer;
}

/* ===== FLOATING MENU ===== */
.fab{
  position:fixed;
  right:18px;
  bottom:22px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#00d09c,#00a3ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:1999;
}

.fab-menu{
  position:fixed;
  right:24px;
  bottom:90px;
  display:none;
  flex-direction:column;
  gap:14px;
  z-index:1999;
}

.fab-menu a{
  width:48px;
  height:48px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00d09c;
  font-size:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.25);
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <div class="hamburger" onclick="toggleSidebar()">☰</div>
  <div class="header-vehicle" onclick="openLoginPopup(event)">
    <i class="fa-solid fa-truck-pickup"></i>
  </div>
  <h1>Cleanova</h1>
  <a href="login.html" class="login-btn">Login</a>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <a href="mainall.html"><i class="fa-solid fa-house"></i> Home</a>
  <a href="mainall.html"><i class="fa-solid fa-list-ul"></i> All</a>
  <a href="mainachievement.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
  <a href="citizenfaq.html"><i class="fa-solid fa-circle-question"></i> FAQ</a>
  <a href="mainsupport.html"><i class="fa-solid fa-headset"></i> Support</a>
  <a href="maininstruction.html"><i class="fa-solid fa-chalkboard-user"></i> Instructions & Info</a>
  <a href="#"><i class="fa-solid fa-thumbtack"></i> Report</a>

  <a href="mainprivacy.html"><i class="fa-solid fa-user-shield"></i> Privacy Policy</a>
  <a href="mainabout.html"><i class="fa-solid fa-address-card"></i> About Us</a>
</div>

<div class="popup" id="loginPopup">
  <div class="popup-content" style="text-align: center; padding: 30px;">
    <div class="close" onclick="closeLoginPopup()">✖</div>
    <i class="fa-solid fa-truck-fast" style="font-size: 50px; color: var(--green); margin-bottom: 15px;"></i>
    <h3>Vehicle Tracking</h3>
    <p>Please login to access vehicle status and location.</p>
    <a href="login.html" class="login-btn" style="display:inline-block; padding: 10px 25px; background: var(--green); color: white;">Login</a>\
    
  </div>
</div>

<div class="stats">
  <div class="stat"><i class="fa-solid fa-check"></i><h2>128 Solved</h2></div>
  <div class="stat"><i class="fa-solid fa-spinner"></i><h2>14 In Progress</h2></div>
  <div class="stat"><i class="fa-solid fa-users"></i><h2>200 Reports</h2></div>
</div>

<div class="filters">
  <a href="mainall.html" class="filter">All</a>
  <a href="mainsolved.html" class="filter">Solved</a>
  <a href="maininprogress.html" class="filter">In Progress</a>

  <a class="filter active">Report</a>
</div>

<div class="search">
  <input type="text" placeholder="Search by area or issue...">
</div>

<div class="container" id="issues"></div>

<div class="fab" onclick="toggleFabMenu(event)">
  <i class="fa-solid fa-ellipsis-vertical"></i>
</div>

<div class="fab-menu" id="fabMenu">
  <a href="tel:9876543210" title="Call">
    <i class="fa-solid fa-phone"></i>
  </a>
  <a href="sms:9876543210" title="Message">
    <i class="fa-solid fa-message"></i>
  </a>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <div class="close" onclick="closePopup()">✖</div>
    <img id="pimg">
    <h3 id="ptitle"></h3>
    <p><b>Area:</b> <span id="ploc"></span></p>
    <p><b>Reported:</b> <span id="prep"></span></p>
    <p><b>Status:</b> Reported</p>
  </div>
</div>

<script>
/* ===== 10 REPORTED ISSUES ===== */
const issues=[
  ["Water trash","Puttur town","07 November 2025","https://www.shutterstock.com/image-photo/ca-mau-vietnam-may-19th-260nw-1106812433.jpg"],
  ["Roadside littering","Main Road","02 September 2025","https://media.istockphoto.com/id/649924830/photo/garbage-inside-the-forest-near-road.jpg?s=612x612&w=0&k=20&c=NsUC5RuRFnqNIDxGoyokVoCe-v4fUOOqmzNWdB1d-XA="],
  ["Overflowing trashbin","Darbe","03 August 2025","https://images.stockcake.com/public/f/a/d/fadace01-740e-4753-9bd3-9dfbc15bde57_large/overflowing-trash-bin-stockcake.jpg"],
  ["Trashbin Waste not collected","Krishna Nagara","28 December 2025","https://t3.ftcdn.net/jpg/02/90/92/92/360_F_290929282_X9GuRfHDe9dLl5wteAxo8vgHCG0YP2om.jpg"],
  ["Illegal Dumping ","Main Road","30 November 2025","https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTG8kS5q8oK0q1Fix5pkUtpCmRhsYJk_50d7w&s"],
  ["Garbage in roadside","Main Road","16 April 2025","https://media.gettyimages.com/id/1479366571/photo/rubbish-littering-grass-verge.jpg?s=612x612&w=gi&k=20&c=lhiAuYbGtLw7l56KUKj1dVeRpJB5qkMazDsNYgZ8aAk="],
  ["Trashbin Overflow","Panchayat Road","02 October 2025","https://www.shutterstock.com/image-photo/pile-trash-waste-bins-dustbins-260nw-2281547923.jpg"],
  ["Water trash","City Lake","25 December 2025","https://img.freepik.com/free-photo/pollution-river-with-plastic-waste_23-2151995193.jpg?semt=ais_hybrid&w=740&q=80"],
  ["Roadside dumping","Town Road","04 Febraury 2025","https://static.toiimg.com/thumb/msid-121787099,width-1070,height-580,imgsize-77414,resizemode-75,overlay-toi_sw,pt-32,y_pad-40/photo.jpg"],
  ["Road side dumping","Highway","09 Febraury 2025","https://www.brisbane.qld.gov.au/content/dam/brisbanecitycouncil/corpwebsite/bins-waste-and-recycling/images/2022-flood-damage-corro-drive_12.jpg/_jcr_content/renditions/cq5dam.web.1280.1280.jpeg"]
];

/* ===== RENDER ===== */
document.getElementById("issues").innerHTML = issues.map((i,idx)=>`
<div class="issue-card">
  <img src="${i[3]}">
  <div class="issue-overlay"
   onclick="openPopup('${i[0]}','${i[1]}','${i[2]}','${i[3]}')">
   View Details
  </div>
  <h4>${i[0]}</h4>
</div>
`).join("");

/* ===== VEHICLE POPUP FUNCTIONS ===== */
function openLoginPopup(e) {
  e.stopPropagation();
  document.getElementById("loginPopup").style.display = "flex";
}
function closeLoginPopup() {
  document.getElementById("loginPopup").style.display = "none";
}

/* ===== SIDEBAR FUNCTIONS ===== */
function toggleSidebar(){
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.toggle("active");
  overlay.classList.toggle("active");
}

function toggleFabMenu(event) {
  event.stopPropagation();
  const fab = document.getElementById("fabMenu");
  fab.style.display = (fab.style.display === "flex") ? "none" : "flex";
}

function openPopup(t,l,r,img){
  document.getElementById("ptitle").innerText=t;
  document.getElementById("ploc").innerText=l;
  document.getElementById("prep").innerText=r;
  document.getElementById("pimg").src=img;
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

// Close menus when clicking outside
window.onclick = function(event) {
  if (event.target.className === 'popup') {
    closePopup();
    closeLoginPopup();
  }
}
</script>

</body>
</html>
